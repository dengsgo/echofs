<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- EchoFS window icon: the runtime window icon passed to eframe (Windows
       taskbar + Linux window/taskbar) and the source of assets/echofs.ico
       embedded into the Windows exe (build.rs + winresource).

       Unlike icon.svg (macOS Big Sur grid), the squircle FILLS the canvas:
       Windows shows the bitmap as-is with no grid masking of its own, so the
       Big Sur margins would render the artwork at ~80% size next to other
       apps' full-bleed taskbar icons. Corner radius keeps the same
       proportion (185/824 ~= 230/1024). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9bff"/>
      <stop offset="1" stop-color="#0060d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Squircle background, edge to edge -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Glyph: folder + concentric echo waves, scaled/centered from the 24px logo.
       Source viewBox 0..24 mapped to a 624px box centered at (200..824). -->
  <g transform="translate(200,200) scale(26)" fill="none"
     stroke="#ffffff" stroke-linecap="round" filter="url(#shadow)">
    <path d="M2 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6z" stroke-width="1.8"/>
    <path d="M10 11a1.5 1.5 0 0 1 0 3" stroke-width="1.5"/>
    <path d="M12.5 9.5a4.5 4.5 0 0 1 0 6" stroke-width="1.5"/>
    <path d="M15 8a7 7 0 0 1 0 9" stroke-width="1.5"/>
  </g>
</svg>
